name: CI

# paths-ignore: commit dữ liệu của bot (2 lần/ngày) không đụng tới code nên
# không cần chạy lại CI. Trước đây mỗi lần scan đều kích hoạt một lượt CI vô ích.
# Commit của bot còn mang [skip ci] — đây là lớp bảo vệ thứ hai.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/data/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'web/data/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      # FIX: trước đây CI chỉ chạy `backend/tests/` nên toàn bộ test của module
      # valuation (test_market_metrics.py, test_peer_database.py nằm trực tiếp
      # trong backend/) KHÔNG được chạy — phần code phức tạp nhất repo có 0%
      # coverage trong CI. Nay quét cả thư mục backend.
      - name: Unit tests
        run: pytest backend -v --cov=backend/scanner --cov-report=term-missing

      # Hai file dưới là smoke test dạng script (chạy engine end-to-end trên dữ
      # liệu mẫu, không cần mạng). pytest không thu thập được vì chúng không có
      # hàm test_*, nên gọi trực tiếp.
      - name: Smoke test — valuation engine (offline)
        env:
          PYTHONIOENCODING: utf-8
        run: python backend/test_valuation_integration.py

      - name: Smoke test — backtest framework
        env:
          PYTHONIOENCODING: utf-8
        run: python backend/test_backtest.py

  # Kiểm lớp nguồn trên API THẬT của Vietcap/KBS (cần mạng). Tách job riêng để
  # khi nguồn đổi định dạng hay chặn runner, CI báo đúng chỗ thay vì lẫn vào
  # unit test. So BCTC với fixture vnstock 4.0.7 — chi tiết ở docstring
  # backend/check_sources.py.
  sources-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Kiểm nguồn dữ liệu thật
        env:
          PYTHONIOENCODING: utf-8
        run: python backend/check_sources.py

  diag-vci-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: python diag/vci_latency.py 120
