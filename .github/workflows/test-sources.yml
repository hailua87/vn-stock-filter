name: Test vnstock Sources

# Workflow ad-hoc để test các vnstock sources cho phiên cụ thể.
# Chạy manual qua "Run workflow" trong Actions tab.
# Không ảnh hưởng workflow chính daily-scan.yml.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker to test (e.g. ACB, VND, FPT)'
        required: false
        default: 'ACB'
      expected_close:
        description: 'Expected close price (from SSI/CafeF)'
        required: false
        default: '24.80'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install vnstock
        run: pip install vnstock pandas

      - name: Test sources
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TICKER: ${{ github.event.inputs.ticker }}
          EXPECTED_CLOSE: ${{ github.event.inputs.expected_close }}
        run: |
          cat > /tmp/test.py << 'PYEOF'
          import os, sys, time, warnings
          warnings.filterwarnings('ignore')

          api_key = os.environ.get('VNSTOCK_API_KEY', '')
          if api_key:
              try:
                  import vnai
                  vnai.setup_api_key(api_key)
                  print(f"✓ vnstock API key configured")
              except Exception as e:
                  print(f"⚠ Could not set API key: {e}")

          from vnstock import Quote
          import pandas as pd

          TICKER = os.environ.get('TICKER', 'ACB')
          EXPECTED = float(os.environ.get('EXPECTED_CLOSE', '24.80'))
          START = '2026-05-20'
          END = '2026-05-26'
          TARGET_DATE = pd.Timestamp('2026-05-26').date()

          print(f"\n{'='*70}")
          print(f"Testing {TICKER} on {TARGET_DATE}, expected close={EXPECTED}")
          print(f"{'='*70}")

          sources = ['vci', 'kbs', 'msn']
          results = {}

          for src in sources:
              print(f"\n--- {src} ---")
              try:
                  time.sleep(2)
                  q = Quote(symbol=TICKER, source=src)
                  df = q.history(start=START, end=END, interval='1D')
                  if df is None or len(df) == 0:
                      print(f"  EMPTY")
                      results[src] = None
                      continue

                  date_col = 'time' if 'time' in df.columns else 'date'
                  df[date_col] = pd.to_datetime(df[date_col])
                  target = df[df[date_col].dt.date == TARGET_DATE]

                  if len(target) == 0:
                      print(f"  No row for {TARGET_DATE} (last date in df: {df[date_col].max().date()})")
                      results[src] = {'close': None, 'date': df[date_col].max().date()}
                      continue

                  row = target.iloc[-1]
                  close = float(row['close'])
                  vol = int(row['volume'])
                  diff = abs(close - EXPECTED)

                  results[src] = {'close': close, 'volume': vol, 'diff': diff}

                  marker = "✅" if diff < 0.1 else "❌"
                  print(f"  {marker} close={close} (diff={diff:.2f}), volume={vol:,}")
              except Exception as e:
                  print(f"  ERROR: {type(e).__name__}: {str(e)[:200]}")
                  results[src] = None

          print(f"\n{'='*70}")
          print("SUMMARY")
          print(f"{'='*70}")
          print(f"{'Source':<10} {'Close':>10} {'Volume':>15} {'Diff':>10}")
          for src, d in results.items():
              if d is None:
                  print(f"{src:<10} {'FAILED':>10}")
              elif d.get('close') is None:
                  print(f"{src:<10} {'No 26/05':>10}")
              else:
                  print(f"{src:<10} {d['close']:>10.2f} {d['volume']:>15,} {d['diff']:>10.2f}")

          # Recommendation
          accurate = [s for s, d in results.items() if d and d.get('close') and d.get('diff', 99) < 0.1]
          print(f"\nRECOMMENDATION:")
          if accurate:
              print(f"  ✅ Switch to source: {accurate[0]}")
              print(f"     Edit data_fetcher.py: source: str = '{accurate[0]}'")
          else:
              print(f"  ⚠️  No source returns close=={EXPECTED}. All sources differ from SSI/CafeF.")
              print(f"     Options:")
              print(f"     1. Document the limitation (current VCI close differs ~2% for some sessions)")
              print(f"     2. Implement cross-validation with web scraping")
              print(f"     3. Pay for premium data source (SSI API, FMP API)")
          PYEOF
          python /tmp/test.py
