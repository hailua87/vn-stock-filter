name: Daily Scan

# Lịch chạy:
#   - 12:00 ICT (05:00 UTC) — INTRADAY: sau phiên sáng close (11:30 ICT + 30p buffer)
#   - 23:00 ICT (16:00 UTC) — EOD: đủ muộn để vnstock cập nhật giá ATC chính thức
# Chỉ chạy T2-T6 (không cuối tuần).
#
# Phân biệt intraday vs EOD:
#   - Workflow tự detect dựa trên giờ chạy (UTC < 9 → intraday, ≥9 → eod)
#   - Commit message và metadata trong JSON output đều có tag để frontend phân biệt
#
# Manual trigger:
#   - Có thể chọn loại run từ UI nếu cần override (vd test khi đang code)
#
# Tại sao EOD 23:00 thay vì 17:00? (Fix 2026-05-27)
#   vnstock VCI có data freshness lag ~6-8 giờ sau HOSE đóng cửa (14:45 ICT):
#     - 14:45-22:00 ICT: vnstock trả giá tạm (matched price giữa phiên)
#     - 22:00+ ICT: vnstock cập nhật giá ATC chính thức
#   Workflow EOD cũ 17:00 (chỉ 2h15 sau close) lấy giá tạm → cache giữ data sai
#   → ngày sau dùng cache → giá vĩnh viễn sai cho phiên đó.
#   23:00 ICT đảm bảo vnstock đã update đúng trước khi scan.
on:
  schedule:
    - cron: '0 5 * * 1-5'    # 12:00 ICT — INTRADAY: sau phiên sáng
    - cron: '0 16 * * 1-5'   # 23:00 ICT — EOD: đợi vnstock update giá ATC
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Loại run (auto = tự detect theo giờ)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - intraday
          - eod

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Cần để commit web/data/latest.json

    # FIX: concurrency group ngăn 2 lần chạy chồng nhau. Nếu intraday đang chạy
    # mà EOD trigger → EOD đợi (cancel-in-progress: false) → tránh conflict commit.
    concurrency:
      group: daily-scan
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # FIX (2026-05-26): xác định loại run intraday/eod để tag metadata và commit.
      # Logic:
      #   - workflow_dispatch + run_type=intraday|eod → dùng giá trị chọn
      #   - workflow_dispatch + run_type=auto → detect theo giờ UTC
      #   - schedule → detect theo giờ UTC (UTC<9 = intraday, ≥9 = eod)
      - name: Determine run type (intraday vs EOD)
        id: runtype
        run: |
          INPUT_TYPE="${{ github.event.inputs.run_type }}"
          UTC_HOUR=$(date -u +%H)
          if [ "$INPUT_TYPE" = "intraday" ] || [ "$INPUT_TYPE" = "eod" ]; then
            RUN_TYPE="$INPUT_TYPE"
            REASON="manual override"
          elif [ "$UTC_HOUR" -lt 9 ]; then
            RUN_TYPE="intraday"
            REASON="auto-detected (UTC hour $UTC_HOUR < 9)"
          else
            RUN_TYPE="eod"
            REASON="auto-detected (UTC hour $UTC_HOUR >= 9)"
          fi
          echo "run_type=$RUN_TYPE" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          echo "═══════════════════════════════════════════════════"
          echo "🏷️  Run type: $RUN_TYPE ($REASON)"
          echo "   UTC hour now: $UTC_HOUR"
          echo "   ICT hour now: $(TZ=Asia/Ho_Chi_Minh date +%H:%M)"
          echo "═══════════════════════════════════════════════════"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Cache OHLCV parquet
        # FIX (2026-05-25): bumped prefix v1 → v2 to invalidate cache containing
        # stale-session data from the "phantom session" bug.
        #
        # FIX (2026-05-27): bumped v2 → v3 to invalidate cache containing
        # WRONG VALUE data. vnstock VCI có data freshness lag ~6-8h sau giờ đóng
        # cửa. Workflow chạy quá sớm (17:00 ICT, chỉ 2h15 sau close) sẽ lấy data
        # tạm của vnstock và cache lại. Sau khi vnstock update đúng (~22:00 ICT
        # trở đi), workflow vẫn dùng cache cũ vì `last_date >= last_session`
        # check pass → không refetch → data sai vĩnh viễn cho phiên đó.
        #
        # Cache key bao gồm github.run_id để mỗi run đều save cache mới;
        # restore-keys khớp prefix 'ohlcv-cache-v3-' để restore cache mới nhất.
        # Cache cũ (v1, v2) sẽ bị GitHub tự dọn sau 7 ngày không dùng.
        uses: actions/cache@v4
        with:
          path: backend/data/cache
          key: ohlcv-cache-v3-${{ github.run_id }}
          restore-keys: |
            ohlcv-cache-v3-

      - name: Run daily scan
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SCAN_RUN_TYPE: ${{ steps.runtype.outputs.run_type }}
        run: |
          python backend/run_daily.py --min-score 5 --limit 500
        timeout-minutes: 60

      - name: Verify scan results
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "📊 SCAN RESULT VERIFICATION (${{ steps.runtype.outputs.run_type }})"
          echo "═══════════════════════════════════════════════════"
          for f in web/data/latest.json \
                   web/data/golden_cross_long/latest.json \
                   web/data/golden_cross_short/latest.json \
                   web/data/ichimoku/latest.json; do
            if [ -f "$f" ]; then
              echo ""
              echo "── $f ──"
              python -c "
          import json, sys
          # encoding tường minh: archive_gate chứa tiếng Việt, đọc bằng locale
          # mặc định sẽ nổ UnicodeDecodeError nếu runner không phải UTF-8.
          with open('$f', encoding='utf-8') as fp:
              d = json.load(fp)
          meta = d.get('metadata', {})
          print(f'  generated_at:   {d.get(\"generated_at\", \"?\")}')
          print(f'  total signals:  {d.get(\"total\", len(d.get(\"signals\", [])))}')
          print(f'  total_scanned:  {meta.get(\"total_scanned\", \"?\")}')
          print(f'  is_demo:        {meta.get(\"demo\", False)}')
          if d.get('signals'):
              tickers = [s.get('ticker', '?') for s in d['signals'][:5]]
              print(f'  top 5 tickers:  {\", \".join(tickers)}')
          sess = meta.get('session_date', '?')
          writ = meta.get('written_at_ict', '?')
          comp = meta.get('session_complete', '?')
          awrt = meta.get('archive_written', '?')
          agat = meta.get('archive_gate', '?')
          print('  ── cong archive ──')
          print(f'  session_date:     {sess}')
          print(f'  written_at_ict:   {writ}')
          print(f'  session_complete: {comp}   (co thong tin, khong dung de chan)')
          print(f'  archive_written:  {awrt}')
          print(f'  archive_gate:     {agat}')
          if meta.get('archive_forced'):
              print('  ARCHIVE BI EP GHI bang --force-archive')
          "
            else
              echo "  ❌ MISSING: $f"
            fi
          done
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "Cache directory size:"
          du -sh backend/data/cache 2>/dev/null || echo "  (no cache dir)"
          echo "Cached parquet files:"
          find backend/data/cache -name "*.parquet" 2>/dev/null | wc -l
          echo "═══════════════════════════════════════════════════"

      # FIX (2026-05-26): Tag JSON output với run_type và run_time để frontend
      # có thể hiển thị badge "Intraday 12:00" hoặc "EOD 17:00" cho user biết
      # độ tươi của data. Patch nhẹ bằng jq để không phải sửa Python.
      - name: Tag JSON outputs with run metadata
        run: |
          RUN_TYPE="${{ steps.runtype.outputs.run_type }}"
          RUN_TIME_ICT=$(TZ=Asia/Ho_Chi_Minh date '+%H:%M')
          RUN_DATE_ICT=$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d')
          echo "Tagging JSONs with run_type=$RUN_TYPE, time_ict=$RUN_TIME_ICT"
          for f in web/data/latest.json \
                   web/data/golden_cross_long/latest.json \
                   web/data/golden_cross_short/latest.json \
                   web/data/ichimoku/latest.json; do
            if [ -f "$f" ]; then
              jq --arg rt "$RUN_TYPE" --arg time "$RUN_TIME_ICT" --arg date "$RUN_DATE_ICT" \
                '.metadata += {run_type: $rt, run_time_ict: $time, run_date_ict: $date}' \
                "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done

      - name: Upload Excel artifact
        # EOD only — intraday không tạo Excel để tiết kiệm storage
        if: steps.runtype.outputs.run_type == 'eod'
        uses: actions/upload-artifact@v4
        with:
          name: signals-${{ github.run_id }}
          path: backend/data/results/*.xlsx
          retention-days: 30

      - name: Commit latest.json + archive
        run: |
          git config user.name "VN Scanner Bot"
          git config user.email "bot@vn-scanner.local"

          # KỶ LUẬT PUSH (sửa 2026-08-13)
          #
          # Bản cũ dùng `merge -X ours` rồi `push --force-with-lease` lên main.
          # Rủi ro: nếu bạn push code trong lúc workflow đang scan (60 phút),
          # bot có thể GHI ĐÈ commit code của bạn. Dữ liệu JSON tạo lại được sau
          # 12 tiếng; commit code thì KHÔNG.
          #
          # Nguyên tắc mới: chỉ rebase + retry. Thất bại thì để thất bại — lần
          # chạy sau sẽ sinh lại dữ liệu. Không bao giờ force-push lên main.
          #
          # Conflict trên chính file data được xử lý bằng merge driver khai báo
          # trong .gitattributes (web/data/** merge=ours) chứ không phải bằng
          # cách ghi đè cả nhánh.

          RUN_TYPE="${{ steps.runtype.outputs.run_type }}"
          RUN_TIME_ICT=$(TZ=Asia/Ho_Chi_Minh date '+%H:%M')

          # NGÀY TRONG MESSAGE LÀ NGÀY PHIÊN, không phải ngày commit.
          #
          # Hai thứ này đã từng lệch thật: commit 68b7237 ghi "signals 2026-08-22"
          # trong khi file nó tạo ra là archive/2026-08-21.json. Nguyên nhân là
          # DATE_ICT lấy đồng hồ lúc commit, còn tên file archive lấy từ
          # df['Date'].max(). Bản EOD chạy 23:00 ICT chỉ cần quét quá 60 phút là
          # qua nửa đêm ICT, và message lệch một ngày so với chính dữ liệu bên
          # trong. Nay cả hai đọc chung một nguồn: metadata.session_date.
          SESSION_DATE=$(python -c "
          import json
          with open('web/data/latest.json', encoding='utf-8') as f:
              print(json.load(f).get('metadata', {}).get('session_date') or '')
          " 2>/dev/null || true)

          if [ -z "$SESSION_DATE" ]; then
            # Không đọc được thì lùi về đồng hồ, nhưng nói rõ ra: nếu thấy dòng
            # này trong log thì message có thể lệch ngày, đừng tin nó.
            SESSION_DATE=$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d')
            echo "::warning::Không đọc được metadata.session_date từ latest.json — message tạm dùng ngày ICT $SESSION_DATE, có thể lệch ngày phiên"
          fi

          if [ "$RUN_TYPE" = "intraday" ]; then
            MSG="chore(data): tin hieu $SESSION_DATE [intraday $RUN_TIME_ICT] [skip ci]"
          else
            MSG="chore(data): tin hieu $SESSION_DATE [EOD $RUN_TIME_ICT] [skip ci]"
          fi

          # Đăng ký merge driver "ours" cho file dữ liệu (khai báo ở .gitattributes).
          # Khi remote và local cùng sửa một file JSON, giữ bản của workflow này.
          git config merge.ours.driver true

          # CHỈ stage đúng thư mục dữ liệu. Nếu bước scan lỡ tạo file ở nơi khác,
          # nó sẽ không lọt vào commit của bot.
          git add web/data/latest.json web/data/archive/                   web/data/golden_cross_long/ web/data/golden_cross_short/                   web/data/ichimoku/

          if git diff --staged --quiet; then
            echo "ℹ️  Không có thay đổi để commit"
            exit 0
          fi

          # Chốt chặn: bot tuyệt đối không được commit file ngoài web/data/
          OUTSIDE=$(git diff --staged --name-only | grep -v '^web/data/' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "❌ Bot đang cố commit file ngoài web/data/:"
            echo "$OUTSIDE"
            exit 1
          fi

          git commit -m "$MSG"
          echo "✓ Đã commit local"

          for i in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }}                && git push origin HEAD:${{ github.ref_name }}; then
              echo "✓ Push thành công ở lần thử $i"
              exit 0
            fi
            echo "⚠️  Lần thử $i thất bại"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done

          echo "❌ Không push được sau 3 lần thử."
          echo "   KHÔNG force-push: dữ liệu sẽ được tạo lại ở lần chạy tiếp theo,"
          echo "   còn commit code trên remote thì không tạo lại được."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily scan failed (${{ steps.runtype.outputs.run_type }}). Check logs above."
