name: Daily Scan

on:
  schedule:
    # 16:00 ICT = 09:00 UTC, mỗi ngày làm việc T2-T6
    - cron: '0 9 * * 1-5'
  workflow_dispatch:  # Cho phép chạy thủ công từ UI

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Cần để commit web/data/latest.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Cache OHLCV parquet
        uses: actions/cache@v4
        with:
          path: backend/data/cache
          key: ohlcv-cache-${{ github.run_id }}
          restore-keys: |
            ohlcv-cache-

      - name: Run daily scan
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python backend/run_daily.py --min-score 5 --limit 500
        timeout-minutes: 60

      - name: Verify scan results
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "📊 SCAN RESULT VERIFICATION"
          echo "═══════════════════════════════════════════════════"
          for f in web/data/latest.json \
                   web/data/golden_cross_long/latest.json \
                   web/data/golden_cross_short/latest.json \
                   web/data/ichimoku/latest.json; do
            if [ -f "$f" ]; then
              echo ""
              echo "── $f ──"
              python -c "
          import json, sys
          with open('$f') as fp:
              d = json.load(fp)
          meta = d.get('metadata', {})
          print(f'  generated_at:   {d.get(\"generated_at\", \"?\")}')
          print(f'  total signals:  {d.get(\"total\", len(d.get(\"signals\", [])))}')
          print(f'  total_scanned:  {meta.get(\"total_scanned\", \"?\")}')
          print(f'  is_demo:        {meta.get(\"demo\", False)}')
          if d.get('signals'):
              tickers = [s.get('ticker', '?') for s in d['signals'][:5]]
              print(f'  top 5 tickers:  {\", \".join(tickers)}')
          "
            else
              echo "  ❌ MISSING: $f"
            fi
          done
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "Cache directory size:"
          du -sh backend/data/cache 2>/dev/null || echo "  (no cache dir)"
          echo "Cached parquet files:"
          find backend/data/cache -name "*.parquet" 2>/dev/null | wc -l
          echo "═══════════════════════════════════════════════════"

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: signals-${{ github.run_id }}
          path: backend/data/results/*.xlsx
          retention-days: 30

      - name: Commit latest.json + archive
        run: |
          git config user.name "VN Scanner Bot"
          git config user.email "bot@vn-scanner.local"
          git add web/data/latest.json web/data/archive/ \
                  web/data/golden_cross_long/ web/data/golden_cross_short/ \
                  web/data/ichimoku/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update signals $(date +%Y-%m-%d)"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily scan failed. Check logs above."
